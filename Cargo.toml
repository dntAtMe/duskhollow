[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
# wav: original sfx; mp3: our own soundtrack (custom_assets/content/custom/music)
bevy = { version = "0.19.1", features = ["wav", "mp3"] }
rusqlite = { version = "0.40", features = ["bundled"] }
zip = { version = "8.6", default-features = false, features = ["deflate"] }
anyhow = "1"
thiserror = "2"
serde = { version = "1", features = ["derive"] }
postcard = { version = "1.1", features = ["use-std"] }
crossbeam-channel = "0.5"
dusk_formats = { path = "crates/dusk_formats" }
dusk_protocol = { path = "crates/dusk_protocol" }

# Fast iteration: optimize deps in dev, keep our code debuggable.
[profile.dev]
opt-level = 1
debug = "line-tables-only"
# Incremental caches grew to several GB with parallel worktrees on a nearly full disk.
incremental = false

# Dependencies: optimized, no debuginfo (Bevy's debuginfo alone is several GB).
[profile.dev.package."*"]
opt-level = 3
debug = false
